<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Administración</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <nav class="navbar">
    <div class="logo">MiTienda</div>
    <ul class="nav-links">
      <li><a href="index.html">Volver a la Tienda</a></li>
    </ul>
  </nav>
</header>
<main class="container login-container">
  <div class="login-box">
    <h2>Acceso Administrativo</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Usuario:</label>
        <input type="text" id="username" required placeholder="Ingresa tu usuario">
      </div>
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" required placeholder="Ingresa tu contraseña">
      </div>
      <p id="error-message" class="error-hidden">Credenciales incorrectas.</p>
      <button type="submit" class="btn-login">Ingresar</button>
    </form>
  </div>
</main>
<script src="login.js"></script>
</body>
</html>
