<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El volcan</title>
    <link rel="stylesheet" href="src/output.css" />
  </head>

  <body class="relative w-full min-h-screen flex flex-col">
    <nav
      class="bg-neutral-primary fixed w-full z-20 top-0 start-0 border-b border-default"
    >
      <div
        class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4"
      >
        <a
          href="index.html"
          class="flex items-center space-x-3 rtl:space-x-reverse"
        >
          <img
            src="assets/images/volcan.avif"
            class="h-10"
            alt="El volcan Logo"
          />
          <span
            class="self-center text-xl text-heading font-semibold whitespace-nowrap"
            >El Volcan</span
          >
        </a>

        <!-- boton celulares -->
        <button
          data-collapse-toggle="navbar-default"
          type="button"
          class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-body rounded-base md:hidden hover:bg-neutral-secondary-soft hover:text-heading focus:outline-none focus:ring-2 focus:ring-neutral-tertiary"
          aria-controls="navbar-default"
          aria-expanded="false"
        >
          <span class="sr-only">Open main menu</span>
          <svg
            class="w-6 h-6"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-width="2"
              d="M5 7h14M5 12h14M5 17h14"
            />
          </svg>
        </button>

        <div class="hidden w-full md:block md:w-auto" id="navbar-default">
          <ul
            class="font-medium flex flex-col p-4 md:p-0 mt-4 border border-default rounded-base bg-neutral-secondary-soft md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:border-0 md:bg-neutral-primary"
          >
            <li>
              <a
                href="#"
                class="block py-2 px-3 text-heading rounded md:p-0"
                aria-current="page"
                >Productos</a
              >
            </li>
            <li>
              <a
                href="#"
                class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent"
                >Servicios</a
              >
            </li>
            <li>
              <a
                href="#"
                class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent"
                >Nosotros</a
              >
            </li>
            <li>
              <a
                href="#"
                class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent"
                >Preguntas frecuentes</a
              >
            </li>
            <li>
              <a
                href="#"
                class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent"
                >Contacto</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="w-full flex-1 pt-24">
      <section id="productos">
        <p>Conoce nuestros productos!</p>
        <h2>Productos</h2>
      </section>

      <section id="servicios">
        <h2>Servicios</h2>
      </section>

      <section id="nosotros">
        <h2>Nosotros</h2>
      </section>

      <section id="faq">
        <h2>Preguntas frecuentes</h2>
      </section>

      <section id="contacto">
        <h2>Contacto</h2>
      </section>
    </main>
    <!-- FOOTER -->
    <footer class="">
      <nav class="text-center border-t">
        <ul
          class="font-medium flex flex-col mt-4 border border-default rounded-base bg-neutral-secondary-soft md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:border-0 md:justify-center md:bg-neutral-primary"
        >
          <li>
            <a href="#">Acerca</a>
          </li>

          <li>
            <a href="#">Contacto</a>
          </li>
        </ul>
        <p class="font-medium">
          © 2026 El Volcan. Todos los derechos reservados.
        </p>
      </nav>
    </footer>
  </body>
</html>
